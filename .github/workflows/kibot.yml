name: "KiCost demo using cache"

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    paths:
      - '*.kicad_sch'
      - '*.kicad_pcb'
      - '*.kibot.yaml'
      - 'Makefile'
      - '.github/workflows/kibot.yml'
  pull_request:
    paths:
      - '*.kicad_sch'
      - '*.kicad_pcb'
      - '*.kibot.yaml'
      - 'Makefile'
      - '.github/workflows/kibot.yml'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  KiCost:
    name: Run KiCost
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad9_auto:dev

    steps:
    - name: Checkout (only last code)
      uses: actions/checkout@v6

    - name: Restore cached KiCost data
      id: kicost-cache-restore
      uses: actions/cache/restore@v5
      with:
        # This path must match the one declared in kicost_config.yaml
        path: ~/kicost_cache
        # The key must be unique, this will be the name used to save, not restore
        key: kicost_cache-${{ github.run_id }}-${{ github.run_attempt }}
        # We restore the newest available
        restore-keys: |
          kicost_cache

    - name: Run KiBot
      env:
        ELEMENT14_KEY: ${{ secrets.ELEMENT14_KEY }}
        MOUSER_KEY: ${{ secrets.MOUSER_KEY }}
        TME_TOKEN: ${{ secrets.TME_TOKEN }}
        TME_APP_SECRET: ${{ secrets.TME_APP_SECRET }}
        DIGIKEY_CLIENT_ID: ${{ secrets.DIGIKEY_CLIENT_ID }}
        DIGIKEY_CLIENT_SECRET: ${{ secrets.DIGIKEY_CLIENT_SECRET }}
      run: |
        ##### Experimental stuff:
        apt-get update
        apt-get -y install --no-install-recommends  python3-pip unzip curl python3-setuptools python3-wheel
        ## Install KiCost@master
        # curl https://codeload.github.com/hildogjr/KiCost/zip/refs/heads/master --output pp.zip
        # unzip pp.zip
        # pip3 install --break-system-packages KiCost-master/
        ## Clean the downloaded stuff
        # rm -rf KiCost-master pp.zip
        ## Install kicost-digikey-api-v4@main
        curl https://codeload.github.com/set-soft/kicost-digikey-api-v4/zip/refs/heads/main --output pp.zip
        unzip pp.zip
        pip3 install --break-system-packages kicost-digikey-api-v4-main/
        ## Clean the downloaded stuff
        rm -rf kicost-digikey-api-v4-main pp.zip
        ##### End Experimental stuff
        #
        mkdir KiCost
        kibot -vvvv 2> KiCost/kibot.log

    - name: Save cached KiCost data
      id: kicost-cache-save
      if: always()
      uses: actions/cache/save@v5
      with:
        # This path must match the one declared in kicost_config.yaml
        path: ~/kicost_cache
        # Unique name
        key: kicost_cache-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Retrieve results
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: All_Outputs
        path: KiCost
