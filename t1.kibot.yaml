# Example KiBot config file
kibot:
  version: 1

outputs:
  - name: 'bom_internal'
    comment: "Bill of Materials with prices"
    type: bom
    dir: KiCost
    options:
      use_alt: true
      number: 50
      group_fields: ['Part', 'Part Lib', 'Value', 'Footprint', 'Footprint Lib']
      columns:
        - References
        - Part
        - Value
        - Quantity Per PCB
        - field: manf
          name: Manufacturer
        - field: manf#
          name: Manufacturer P/N
        - field: digikey#
          level: 1
          comment: 'Code used to buy the part at Digi-Key'
      distributors:
        - Mouser
        - Digi-Key
        - TME
        - Farnell
      xlsx:
        kicost: true
        specs: true
        kicost_config: kicost_config.yaml

